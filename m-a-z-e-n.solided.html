<body id="page-body" class="w-screen h-screen flex items-center justify-center relative">

    <a href="m-a-z-e-n.dashboard.html" class="back-nav inline-flex items-center gap-2 bg-slate-900/80 border border-slate-700 px-4 py-2 rounded-xl text-white text-xs font-semibold tracking-wider backdrop-blur-md">

    <main class="w-full h-full flex items-center justify-center p-4">
        <div class="relative w-full max-w-2xl aspect-square max-h-[85vh] flex items-center justify-center">
            <img 
                id="slideshow-img" 
                src="1000103083.jpg" 
                alt="Solid Pic" 
                class="w-full h-full object-contain rounded-2xl shadow-2xl transition-opacity duration-500"
                onerror="this.onerror=null; this.src='https://placehold.co/800x800/000000/FFFFFF?text=MAZEN+SERAG';"
            />
        </div>
    </main>

    <script>
        const imgElement = document.getElementById('slideshow-img');
        const bodyElement = document.getElementById('page-body');

        // Only use your specific photo file
        const photos = ['1000103083.jpg'];

        function triggerCycle() {
            bodyElement.style.backgroundColor = '#ffffff';
            imgElement.style.opacity = '0';

            setTimeout(() => {
                bodyElement.style.backgroundColor = '#000000';
                imgElement.style.opacity = '1';
            }, 3500); // 3.5 seconds white screen
        }

        // Every 3 minutes (180,000 ms)
        setInterval(triggerCycle, 180000);
    </script>
